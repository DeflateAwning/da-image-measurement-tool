[package]
name = "da-image-measurement-tool"
version = "0.1.1"
edition = "2021"
description = "A reverse-engineering tool: load an image, calibrate a known dimension, and read off other dimensions in real-world units."
repository = "https://github.com/DeflateAwning/da-image-measurement-tool"
license = "BSD-3-Clause"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
rfd = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
env_logger = "0.11"
anyhow = "1"
indexmap = "=2.2.6"
wayland-protocols = "=0.31.2"
smithay-clipboard = "=0.7.1"
idna_adapter = "=1.1.0"
home = "=0.5.9"

[profile.release]
opt-level = 3
lto = true
